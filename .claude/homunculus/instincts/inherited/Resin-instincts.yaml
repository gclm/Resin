# Resin Workflow Feature Development With Schema And Ui Update

## Action

Follow the feature-development-with-schema-and-ui-update workflow:
1. Update backend schema and repository logic (e.g., add column to schema, migrate databases).
2. Update backend logic and API handlers to support the new field.
3. Update or add backend and API contract tests.
4. Expose the new field in API responses.
5. Update UI components and types to display the new field.
6. Update UI translations if necessary.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~1x per month
- Files: internal/requestlog/schema.go, internal/requestlog/repo.go, internal/api/handler_requestlog.go

